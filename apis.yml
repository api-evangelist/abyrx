name: Abyrx
description: >-
  Abyrx is a medical device company that develops a materials-science platform
  for therapeutic devices used during surgical procedures, with an initial focus
  on hemostatic bone putties. Its flagship product, MONTAGE, is a cohesive,
  settable, and resorbable hemostatic bone putty that adheres to bleeding bone
  surfaces, used in orthopedic, trauma, spine, sports medicine, cranial,
  maxillofacial, and cardiothoracic surgeries. Abyrx is a B2B medical device
  manufacturer serving healthcare providers and surgeons; it is not a technology
  platform and publishes no public API, developer portal, or technical
  documentation. This profile was surfaced as a portfolio company of Canaan
  Partners and added to the API Evangelist network.
